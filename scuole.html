<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area Scuole — Giornata dell’Albero MadrEtna</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--verde:#2d5a27;--vc:#4a8c3f;--btn:#2d5a27;--lava:#1a1a1a;--sab:#f4ede0;--gr:#e8e2d9;--ros:#c0392b;--oro:#c98a2c;--sf:#fff;--mute:#666;--soft:#eaf5e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--verde:#8bc34a;--sab:#1b1f1a;--sf:#262b25;--lava:#ece8dd;--gr:#3a4036;--mute:#a9b0a2;--soft:#2c3a2a}}
:root[data-theme="dark"]{--verde:#8bc34a;--sab:#1b1f1a;--sf:#262b25;--lava:#ece8dd;--gr:#3a4036;--mute:#a9b0a2;--soft:#2c3a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--lava);background:var(--sab);min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.demo{background:#fff6e0;color:#7a5c12;text-align:center;font-size:.8rem;padding:6px 12px;border-bottom:1px solid #ecd9a0}
header{background:var(--sf);border-bottom:3px solid var(--verde);box-shadow:0 2px 12px rgba(0,0,0,.15);padding:0 1.2rem}
.hi{display:flex;align-items:center;gap:.7rem;height:64px;max-width:1000px;margin:0 auto}
header img{height:44px}
.zona{display:flex;align-items:center;gap:.35rem;font-family:'Playfair Display',serif;font-weight:700;padding-left:.7rem;border-left:1px solid var(--gr)}
.cuore{color:var(--ros)}
.hi .r{margin-left:auto;display:flex;gap:.5rem}
.hero{background:linear-gradient(rgba(26,26,26,.45),rgba(26,26,26,.45)),#2d5a27;color:#fff;text-align:center;padding:2.2rem 1.2rem 2rem}
.hero h1{font-size:2.1rem;line-height:1.25}
.hero p{max-width:520px;margin:.8rem auto 0;font-size:.95rem;opacity:.92;line-height:1.6}
.hero .t{height:210px;width:auto;display:block;margin:0 auto .6rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.sb{background:var(--verde)}
:root[data-theme="dark"] .sb,:root:not([data-theme="light"]) .sb{--x:0}
.sbi{max-width:1000px;margin:0 auto;display:flex;justify-content:center;gap:3rem;padding:.9rem 1.2rem;flex-wrap:wrap}
.si{text-align:center;color:var(--sab);font-size:.78rem}
.si b{display:block;font:700 1.5rem 'Playfair Display',serif;color:#fff}
main{max-width:1000px;margin:0 auto;padding:2rem 1.2rem 3rem}
.btn{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:.7rem 1.3rem;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{background:var(--vc)}
.btn.alt{background:transparent;color:var(--verde);border:1.5px solid var(--gr)}
.btn.sm{padding:.35rem .7rem;font-size:.8rem}
input,select,textarea{background:var(--sf);border:1px solid var(--gr);border-radius:8px;padding:.65rem .8rem;width:100%;font-size:.92rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--vc);box-shadow:0 0 0 3px rgba(74,140,63,.2)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--verde);margin:.9rem 0 .3rem}
.card{background:var(--sf);border-radius:16px;padding:1.5rem 1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.06);border-top:4px solid var(--verde)}
.card.o{border-top-color:var(--oro)}.card.r{border-top-color:var(--ros)}
.card h3{font-size:1.1rem}.card p{margin:.3rem 0;font-size:.85rem;color:var(--mute);line-height:1.5}
.lc{max-width:420px;margin:-1px auto 0;padding:0}
.err{background:#fbe9e7;color:var(--ros);border:1px solid #f3c6c0;border-radius:8px;padding:.6rem .8rem;font-size:.82rem;margin-top:1rem}
.quick{margin-top:1.2rem;font-size:.8rem;color:var(--mute);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--gr);margin-bottom:1.4rem;overflow-x:auto}
.tabs button{background:none;border:0;padding:.7rem 1rem;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--verde);border-bottom-color:var(--verde)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:760px){.cols{grid-template-columns:1fr}.hero .t{height:160px}}
.alb{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.alb img{height:96px;flex:none}
.pill{display:inline-block;background:var(--soft);color:var(--verde);border-radius:99px;padding:.1rem .65rem;font-size:.75rem;font-weight:600}
.pill.off{background:#fff6e0;color:#7a5c12}
.map{position:relative;aspect-ratio:2/1;border-radius:12px;overflow:hidden;background:linear-gradient(#cfe3f1,#f4ede0 70%)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .m{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:.7rem;font-weight:600;line-height:1.1}
.map .m img{height:46px;display:block;margin:0 auto}
.map .m span{background:rgba(255,255,255,.85);color:#1a1a1a;border-radius:6px;padding:0 .3rem}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--gr);font-size:.88rem}
th{background:var(--soft);color:var(--verde);font-size:.75rem}
code{background:var(--sab);padding:.1rem .4rem;border-radius:5px}
.tl{border-left:3px solid var(--verde);padding-left:1.2rem;margin-left:.4rem}
.tl article{margin-bottom:1.3rem;position:relative}
.tl article:before{content:"";position:absolute;left:-1.7rem;top:.3rem;width:12px;height:12px;border-radius:50%;background:var(--oro);border:2px solid var(--verde)}
.tl time{font-size:.75rem;color:var(--mute);font-weight:600}
.ph{width:100%;max-width:240px;aspect-ratio:4/3;border-radius:10px;object-fit:cover;background:var(--soft);display:block;margin-top:.4rem}
.cert{background:#fffdf4;color:#1a1a1a;border:3px double #2d5a27;outline:8px solid #f4ede0;padding:2rem 1.4rem;text-align:center;max-width:560px;margin:0 auto;border-radius:6px}
.cert img.l{height:40px}.cert img.t{height:170px;margin:.6rem 0}
.cert h2{font-size:1.9rem;color:#2d5a27}.cert .n{font:900 2rem 'Playfair Display',serif;margin:.3rem 0}
.cert p{margin:.4rem 0;font-size:.9rem}.cert .d{font:1.3rem 'Kaushan Script',cursive;color:#2d5a27}
.cert .sig{display:flex;justify-content:space-around;margin-top:1.6rem;font-size:.8rem}
.cert .sig div{border-top:1px solid #1a1a1a;padding-top:4px;min-width:130px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:.6rem 1.1rem;border-radius:10px;z-index:9;font-size:.85rem}
footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--mute)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;outline:0}}
.vuoto{color:var(--mute);font-size:.88rem;padding:.6rem 0}
.elenco{display:flex;flex-direction:column;gap:.35rem;margin-top:.8rem;max-height:420px;overflow-y:auto}
.riga{display:flex;align-items:center;gap:.7rem;background:var(--sab);border-radius:10px;padding:.5rem .7rem;font-size:.86rem}
.riga label{display:flex;align-items:center;gap:.7rem;margin:0;font-weight:400;color:var(--lava);font-size:.86rem;cursor:pointer;flex:1}
.riga input[type=checkbox]{width:auto;flex:none}
.riga small{color:var(--mute);display:block}
.riga .btn{margin-left:auto;flex:none}
.barra{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-top:.8rem}
.barra input{flex:1;min-width:160px}
.cred{max-width:460px;margin:0 auto 1.4rem;background:#fffdf4;color:#1a1a1a;border:3px double #2d5a27;border-radius:8px;padding:1.4rem 1.4rem 1.2rem;text-align:center}
.cred h3{color:#2d5a27;font-size:1.25rem}
.cred dl{margin:1rem 0;text-align:left;display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.95rem}
.cred dt{color:#666}
.cred dd{margin:0;font:600 1.05rem ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.cred p{color:#555;font-size:.8rem;margin:.4rem 0}
.cred .az{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1rem}
.cred .btn.alt{color:#2d5a27;border-color:#c9c2b4}
@media print{.cred .az{display:none}.cred{border-width:2px}}
</style>
</head>

async function rpc(nome,args){

    if(/jwt|token/i.test(r.error.message)){var e=new Error("Sessione scaduta: accedi di nuovo.");e.scaduta=true;throw e}

  app.innerHTML=head("")+hero("Area Scuole","Il diario di crescita degli alberi piantati ai Monti Rossi di Nicolosi, raccontato dalle classi che li hanno adottati.")+
  '<main><form class="card lc" id="lf"><h3>Accedi</h3><label for="u">Classe oppure email</label><input id="u" autocomplete="username" placeholder="es. 5A, oppure nome@scuola.it" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>'+
  (msg?'<div class="err" role="alert">'+esc(msg)+'</div>':'')+
  '<p style="margin-top:1.2rem"><button class="btn" style="width:100%" type="submit" id="go">Entra</button></p></form></main><footer>Associazione MadrEtna — Nicolosi</footer>';
  var f=document.getElementById("lf");
  f.onsubmit=async function(e){
    e.preventDefault();
    var u=f.u.value.trim(),p=f.p.value;if(!u||!p)return;
    var email=u.indexOf("@")>0?u.toLowerCase():u.toLowerCase().replace(/[\sªº°]/g,"")+"@"+DOMINIO;
    document.getElementById("go").disabled=true;
    var r=await sb.auth.signInWithPassword({email:email,password:p});
    if(r.error)return login("Classe o password non corretta. Riprova.");
    instrada(r.data.user)}}

async function instrada(user){
  var r=await sb.from("profili").select("ruolo,classe_id").eq("user_id",user.id).maybeSingle();
  if(r.error)return login("Sessione scaduta: accedi di nuovo.");
  var p=r.data;
  if(!p)return nonAbilitato();
  S.ruolo=p.ruolo;S.classeId=p.classe_id;S.email=user.email;
  if(user.user_metadata&&user.user_metadata.cambia_password)return cambioPw();
  if(p.ruolo==="classe"){
    var c=await sb.from("classi").select("nome,attiva").eq("id",p.classe_id).maybeSingle();
    if(!c.data||!c.data.attiva){await sb.auth.signOut();return login("Questa classe è sospesa. Contatta la segreteria.")}
    S.nomeClasse=c.data.nome;return classe()}
  try{await caricaClassi()}catch(e){return guasto(e)}
  pannello()}

function nonAbilitato(){
  app.innerHTML=head(esci())+hero("Account non abilitato","Questo account non può entrare nell’Area Scuole.")+
  '<main><div class="card o"><h3>Serve un account scuola</h3><p>Se sei un insegnante, chiedi alla segreteria le credenziali della tua classe. Se sei un volontario, usa la modalità operatore.</p></div></main>';
  cablaEsci()}

function cambioPw(){
  app.innerHTML=head(esci())+hero("Scegli la tua password","È il primo accesso: sostituisci la password temporanea con una tua.")+
  '<main><form class="card lc" id="cf"><h3>Nuova password</h3><label for="n1">Nuova password (almeno 10 caratteri)</label><input id="n1" type="password" minlength="10" autocomplete="new-password" required><label for="n2">Ripetila</label><input id="n2" type="password" minlength="10" autocomplete="new-password" required><div id="ce"></div><p style="margin-top:1.2rem"><button class="btn" style="width:100%" type="submit">Salva la password</button></p></form></main>';
  cablaEsci();
  var f=document.getElementById("cf");
  f.onsubmit=async function(e){
    e.preventDefault();
    var er=document.getElementById("ce");
    if(f.n1.value!==f.n2.value){er.innerHTML='<div class="err" role="alert">Le due password non coincidono.</div>';return}
    var r=await sb.auth.updateUser({password:f.n1.value,data:{cambia_password:false}});
    if(r.error){er.innerHTML='<div class="err" role="alert">'+esc(r.error.message)+'</div>';return}
    toast("Password salvata");
    var u=await sb.auth.getUser();instrada(u.data.user)}}

/* ----------------------------------------------------- area classe (prossima fase) */
function classe(){
  app.innerHTML=head(esci())+hero("Classe "+esc(S.nomeClasse),"Istituto Comprensivo Statale “Cardinale G. B. Dusmet” · adozione 2026/27")+
  '<main><div class="card o"><h3>Benvenuti!</h3><p>Qui compariranno i vostri alberi, il diario, il grafico di crescita e il certificato. L’area sarà attiva a breve.</p></div></main><footer>Associazione MadrEtna — Nicolosi</footer>';
  cablaEsci()}

/* ------------------------------------------------------------ pannello segreteria */
async function caricaClassi(){S.classi=await rpc("scuola_riepilogo")}

function credenziali(){
  var c=S.cred;if(!c)return "";
  var pagina=location.href.split("#")[0].split("?")[0];
  return '<div class="cred" id="cred" role="region" aria-label="Credenziali"><h3>'+esc(c.titolo)+'</h3><dl>'+
    c.righe.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>'}).join("")+
    '<dt>Pagina</dt><dd style="font-size:.8rem">'+esc(pagina)+'</dd></dl><p>'+esc(c.nota)+'</p>'+
    '<div class="az"><button class="btn sm" id="cp">Copia</button><button class="btn alt sm" id="st">Stampa</button><button class="btn alt sm" id="ch">Chiudi</button></div></div>'}

function cablaCred(){
  var c=S.cred;if(!c)return;
  var cp=document.getElementById("cp");
  cp.onclick=function(){
    var t=c.titolo+"\n"+c.righe.map(function(r){return r[0]+": "+r[1]}).join("\n")+"\nPagina: "+location.href.split("#")[0].split("?")[0];
    try{navigator.clipboard.writeText(t).then(function(){toast("Copiato")},function(){toast("Copia non riuscita")})}catch(e){toast("Copia non riuscita")}};
  document.getElementById("st").onclick=function(){try{window.print()}catch(e){toast("Stampa non disponibile")}};
  document.getElementById("ch").onclick=function(){S.cred=null;pannello()}}

function pannello(){
  var adm=S.ruolo==="admin",att=0,al=0,da=0;
  S.classi.forEach(function(c){if(c.attiva)att++;al+=+c.n_alberi;da+=+c.n_da_approvare});
  var righe=S.classi.length?S.classi.map(function(c,i){
    return '<tr><td><b>'+esc(c.nome)+'</b><br><small>'+(c.ordine==="secondaria"?"Secondaria":"Primaria")+'</small></td><td><code>'+esc(c.codice)+'</code></td><td>'+c.n_alberi+'</td><td>'+(+c.n_da_approvare?'<span class="pill off">'+c.n_da_approvare+' da approvare</span>':'—')+'</td><td><span class="pill'+(c.attiva?"":" off")+'">'+(c.attiva?"Attiva":"Sospesa")+'</span></td><td><button class="btn alt sm" data-a="'+i+'">Alberi</button> <button class="btn alt sm" data-r="'+i+'">Nuova password</button> <button class="btn alt sm" data-t="'+i+'">'+(c.attiva?"Sospendi":"Riattiva")+'</button>'+(adm?' <button class="btn alt sm" data-x="'+i+'">Elimina</button>':'')+'</td></tr>'
  }).join(""):'<tr><td colspan="6" class="vuoto">Nessuna classe ancora. '+(adm?'Aggiungi la prima qui sotto.':'La segreteria di MadrEtna inserirà le classi.')+'</td></tr>';
  var nuova=adm?'<div class="cols" style="margin-top:1.4rem"><div class="card o"><h3>Aggiungi una classe</h3><div class="cols"><div><label for="nn">Nome (es. 5ª A)</label><input id="nn"></div><div><label for="ni">Codice di accesso (es. 5A)</label><input id="ni" maxlength="8"></div></div><label for="no">Ordine di scuola</label><select id="no"><option value="primaria">Primaria</option><option value="secondaria">Secondaria</option></select><p style="margin-top:1rem"><button class="btn" id="add">Crea classe e password</button></p></div>'+
    '<div class="card o"><h3>Utente del professore</h3><p>Crea l’accesso del referente che gestirà le classi dopo di noi. Al primo accesso sceglierà una password sua.</p><label for="re">Email del professore</label><input id="re" type="email" autocomplete="off"><p style="margin-top:1rem"><button class="btn" id="mkref">Crea utente professore</button></p></div></div>':'';
  app.innerHTML=head(esci())+hero(adm?"Pannello MadrEtna":"Pannello della scuola","Gestisci le classi, le loro password e gli alberi assegnati.")+
    stats([[att+" / "+S.classi.length,"classi attive"],[al,"alberi assegnati"],[da,"osservazioni da approvare"]])+
    '<main>'+credenziali()+'<div class="sc"><table><tr><th>CLASSE</th><th>CODICE</th><th>ALBERI</th><th>DIARIO</th><th>STATO</th><th>AZIONI</th></tr>'+righe+'</table></div>'+nuova+'</main><footer>Associazione MadrEtna — Nicolosi</footer>';
  cablaEsci();cablaCred();
  app.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){assegna(S.classi[b.dataset.a].classe_id)}});
  app.querySelectorAll("[data-r]").forEach(function(b){b.onclick=async function(){
    var c=S.classi[b.dataset.r];
    if(!confirm("Creare una nuova password per "+c.nome+"? Quella attuale smetterà di funzionare."))return;
    try{var r=await fn({azione:"reset_password",classe_id:c.classe_id});
      S.cred={titolo:"Accesso "+c.nome,righe:[["Classe",c.codice],["Password",r.password]],nota:"Copia o stampa ora: la password non verrà più mostrata."};
      pannello();window.scrollTo(0,0)}catch(e){guasto(e)}}});
  app.querySelectorAll("[data-t]").forEach(function(b){b.onclick=async function(){
    var c=S.classi[b.dataset.t];
    var r=await sb.from("classi").update({attiva:!c.attiva}).eq("id",c.classe_id);
    if(r.error)return guasto(new Error(/jwt/i.test(r.error.message)?"Sessione scaduta: accedi di nuovo.":r.error.message));
    try{await caricaClassi();pannello();toast(c.attiva?"Classe sospesa":"Classe riattivata")}catch(e){guasto(e)}}});
  app.querySelectorAll("[data-x]").forEach(function(b){b.onclick=async function(){
    var c=S.classi[b.dataset.x];
    if(!confirm("Eliminare "+c.nome+"? Spariscono l’accesso e l’assegnazione degli alberi (gli alberi restano sulla mappa)."))return;
    try{await fn({azione:"elimina_classe",classe_id:c.classe_id});await caricaClassi();pannello();toast("Classe eliminata")}catch(e){guasto(e)}}});
  var add=document.getElementById("add");
  if(add)add.onclick=async function(){
    var n=document.getElementById("nn").value.trim(),i=document.getElementById("ni").value.trim(),o=document.getElementById("no").value;
    if(!n||!i)return toast("Compila nome e codice");
    add.disabled=true;
    try{var r=await fn({azione:"crea_classe",nome:n,codice:i,ordine:o});
      S.cred={titolo:"Accesso "+r.classe.nome,righe:[["Classe",r.classe.codice],["Password",r.password]],nota:"Copia o stampa ora: la password non verrà più mostrata."};
      await caricaClassi();pannello();window.scrollTo(0,0)}catch(e){add.disabled=false;guasto(e)}};
  var mk=document.getElementById("mkref");
  if(mk)mk.onclick=async function(){
    var em=document.getElementById("re").value.trim();
    if(!em)return toast("Scrivi l’email del professore");
    mk.disabled=true;
    try{var r=await fn({azione:"crea_referente",email:em});
      S.cred={titolo:"Accesso del professore",righe:[["Email",r.email],["Password temporanea",r.password]],nota:"Al primo accesso dovrà scegliere una password sua. Copia o stampa ora: questa non verrà più mostrata."};
      pannello();window.scrollTo(0,0)}catch(e){mk.disabled=false;guasto(e)}}}

/* --------------------------------------------------- assegnazione degli alberi */
async function assegna(id){S.sel=id;S.scelti={};S.cerca="";await ricaricaAlberi()}
async function ricaricaAlberi(){
  try{
    S.dellaClasse=await rpc("scuola_alberi",{p_classe:S.sel});
    S.liberi=await rpc("scuola_alberi",{p_cerca:S.cerca||null,p_liberi:true});
    vistaAssegna()}catch(e){guasto(e)}}

function descrAlbero(a){
  var d=[];if(a.specie)d.push(esc(a.specie));if(a.piantato_da)d.push("piantato da "+esc(a.piantato_da));if(a.data_piantumazione)d.push(fd(a.data_piantumazione));
  return '<b>'+esc(a.nome||a.codice)+'</b><small>'+(d.join(" · ")||"—")+'</small>'}

function vistaAssegna(){
  var c=S.classi.filter(function(x){return x.classe_id===S.sel})[0];if(!c)return pannello();
  var sx=S.dellaClasse.length?S.dellaClasse.map(function(a){return '<div class="riga"><div>'+descrAlbero(a)+'</div><button class="btn alt sm" data-d="'+a.id+'">Togli</button></div>'}).join(""):'<div class="vuoto">Nessun albero assegnato a questa classe.</div>';
  var dx=S.liberi.length?S.liberi.map(function(a){return '<div class="riga"><label><input type="checkbox" data-c="'+a.id+'"'+(S.scelti[a.id]?" checked":"")+'><span>'+descrAlbero(a)+'</span></label></div>'}).join(""):'<div class="vuoto">Nessun albero libero'+(S.cerca?' per questa ricerca':'')+'.</div>';
  var tanti=S.liberi.length>=500?'<p style="font-size:.78rem">Mostrati i primi 500: restringi la ricerca per vedere gli altri.</p>':'';
  app.innerHTML=head('<button class="btn alt sm" id="ind">← Torna al pannello</button> '+esci())+hero("Alberi della classe "+esc(c.nome),"Scegli a destra gli alberi piantati dai bambini e assegnali alla classe.")+
    '<main><div class="cols"><div class="card"><h3>Già assegnati ('+S.dellaClasse.length+')</h3><div class="elenco">'+sx+'</div></div>'+
    '<div class="card o"><h3>Alberi non ancora assegnati</h3><form class="barra" id="cf2"><input id="q" type="search" placeholder="Cerca per nome albero, codice o chi lo ha piantato" value="'+esc(S.cerca)+'"><button class="btn alt sm" type="submit">Cerca</button></form><div class="elenco">'+dx+'</div>'+tanti+
    '<div class="barra"><button class="btn alt sm" id="tutti" type="button">Seleziona tutti</button><button class="btn sm" id="ass" type="button">Assegna a '+esc(c.nome)+'</button></div></div></div></main>';
  cablaEsci();
  document.getElementById("ind").onclick=async function(){try{await caricaClassi();pannello()}catch(e){guasto(e)}};
  document.getElementById("cf2").onsubmit=function(e){e.preventDefault();S.cerca=document.getElementById("q").value.trim();S.scelti={};ricaricaAlberi()};
  function conta(){var n=Object.keys(S.scelti).filter(function(k){return S.scelti[k]}).length;document.getElementById("ass").textContent=n?"Assegna "+n+" a "+c.nome:"Assegna a "+c.nome}
  app.querySelectorAll("[data-c]").forEach(function(b){b.onchange=function(){S.scelti[b.dataset.c]=b.checked;conta()}});
  conta();
  document.getElementById("tutti").onclick=function(){app.querySelectorAll("[data-c]").forEach(function(b){b.checked=true;S.scelti[b.dataset.c]=true});conta()};
  document.getElementById("ass").onclick=async function(){
    var ids=Object.keys(S.scelti).filter(function(k){return S.scelti[k]});
    if(!ids.length)return toast("Seleziona almeno un albero");
    try{var n=await rpc("scuola_assegna",{p_classe:S.sel,p_alberi:ids});S.scelti={};toast(ids.length+" alberi assegnati");await ricaricaAlberi()}catch(e){guasto(e)}};
  app.querySelectorAll("[data-d]").forEach(function(b){b.onclick=async function(){
    try{await rpc("scuola_rimuovi",{p_albero:b.dataset.d});toast("Albero tolto dalla classe");await ricaricaAlberi()}catch(e){guasto(e)}}})}

/* -------------------------------------------------------------------- avvio */
(async function(){
  if(SUPABASE_URL.indexOf("INCOLLA")===0){
    app.innerHTML=head("")+'<main><div class="card r"><h3>Configurazione mancante</h3><p>In cima al file scuole.html incolla l’URL del progetto e la anon key di Supabase (gli stessi di operatore.html).</p></div></main>';return}
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  var r=await sb.auth.getSession();
  if(r.data.session)instrada(r.data.session.user);else login()})();
</script>
</body>
</html>
