<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamGeo Snap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Contenitore principale della fotocamera */
        .camera-container { position: relative; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: #111; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Overlay in alto: una sola riga piccola (coordinate + nota, se c'è) */
        .overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: calc(100% - 20px);
            background: rgba(0, 0, 0, 0.55);
            border-radius: 999px;
            padding: 4px 12px;
            z-index: 10;
            pointer-events: none;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gps-row { font-family: monospace; font-weight: bold; color: #4ade80; }
        .text-row { color: #ffffff; }
        .text-row:not(:empty)::before { content: " \00b7  "; color: #4ade80; }

        /* Pannello di controllo inferiore */
        .controls {
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #4ade80; }
        
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #4ade80;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background: #22c55e; }
        
        canvas { display: none; }
        .toast { position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #4ade80; font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 20; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Overlay visivo in tempo reale -->
        <div class="overlay-info"><span class="gps-row" id="gpsDisplay">📍 GPS in corso…</span><span class="text-row" id="textDisplay"></span></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Nome albero e classe, es. Daniela 5A" maxlength="100">
        <button id="snapButton">📸 Scatta e Salva Foto</button>
    </div>

    <canvas id="canvas"></canvas>
    <div class="toast" id="toast"></div>

    <script>
        const video = document.getElementById('video');
        const userInput = document.getElementById('userInput');
        const textDisplay = document.getElementById('textDisplay');
        const gpsDisplay = document.getElementById('gpsDisplay');
        const snapButton = document.getElementById('snapButton');
        const canvas = document.getElementById('canvas');

        let currentCoords = "GPS non disponibile";
        let lastLat = null, lastLon = null;   // numeri, per il nome del file

        // 1. Avvia la fotocamera (preferendo la fotocamera posteriore sui telefoni)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                // Fallimento con "environment", riprova con una qualsiasi fotocamera disponibile
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera: " + e.message);
                }
            }
        }

        // 2. Ottieni la posizione GPS in tempo reale
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const alt = position.coords.altitude ? ` · ${Math.round(position.coords.altitude)} m` : '';
                        currentCoords = `${lat}, ${lon}${alt}`;
                        lastLat = position.coords.latitude; lastLon = position.coords.longitude;
                        gpsDisplay.textContent = `📍 ${currentCoords}`;
                    },
                    (error) => {
                        gpsDisplay.textContent = "📍 GPS non disponibile";
                        currentCoords = "GPS non disponibile";
                        lastLat = null; lastLon = null;
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            } else {
                gpsDisplay.textContent = "📍 Geolocalizzazione non supportata";
            }
        }

        // Sincronizza il testo digitato con l'overlay in alto
        userInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            textDisplay.textContent = val;  // vuota = non si legge niente oltre alle coordinate
        });

        // Disegna la riga informativa: dimensione proporzionale alla foto, sempre dentro l'immagine
        function disegnaRiga(ctx, W, coords, nota) {
            let fs = Math.max(14, Math.round(W * 0.018));   // es. 640px -> 14px, 1920px -> 35px
            const gpsText = `📍 ${coords}`;
            const sep = ' \u00b7 ';
            const margin = Math.round(fs * 0.7);
            const padX = Math.round(fs * 0.7), padY = Math.round(fs * 0.4);
            const maxW = W - 2 * margin - 2 * padX;
            ctx.textBaseline = 'middle';

            const misura = () => {
                ctx.font = `bold ${fs}px monospace`;
                const g = ctx.measureText(gpsText).width;
                if (!nota) return { g, s: 0, n: 0 };
                ctx.font = `${fs}px sans-serif`;
                return { g, s: ctx.measureText(sep).width, n: ctx.measureText(nota).width };
            };
            let m = misura();
            while (m.g + m.s + m.n > maxW && fs > 11) { fs -= 1; m = misura(); }   // riduci se non ci sta
            while (nota && m.g + m.s + m.n > maxW && nota.length > 1) {              // poi accorcia la nota
                nota = nota.slice(0, -2).trimEnd() + '\u2026';
                m = misura();
            }

            const boxW = m.g + m.s + m.n + 2 * padX, boxH = fs + 2 * padY;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(margin, margin, boxW, boxH, boxH / 2); else ctx.rect(margin, margin, boxW, boxH);
            ctx.fill();

            const y = margin + boxH / 2;
            let x = margin + padX;
            ctx.fillStyle = '#4ade80';
            ctx.font = `bold ${fs}px monospace`;
            ctx.fillText(gpsText, x, y);
            if (nota) {
                x += m.g;
                ctx.font = `${fs}px sans-serif`;
                ctx.fillText(sep, x, y);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(nota, x + m.s, y);
            }
        }

        // 3. Funzione per scattare la foto e imprimere i dati sul canvas
        snapButton.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("La fotocamera non è ancora pronta.");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Disegna il fotogramma della telecamera
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Una sola riga piccola in alto a sinistra: coordinate e, solo se scritta, la nota
            disegnaRiga(ctx, canvas.width, currentCoords, userInput.value.trim());

            // Salva la foto come JPEG (molto più leggera del PNG). Il nome del file porta nota e coordinate:
            //   Daniela-5A_37.616251_15.028598.jpg   -> completa-schede.html le abbina da sola alla scheda
            const nota = userInput.value.trim();
            const slug = nota.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'foto';
            const pos = (lastLat !== null && lastLon !== null)
                ? `_${lastLat.toFixed(6)}_${lastLon.toFixed(6)}` : '_senza-gps';
            const nomeFile = `${slug}${pos}.jpg`;

            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = nomeFile;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                const toast = document.getElementById('toast');
                toast.textContent = '✔ Salvata: ' + nomeFile;
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 3000);
            }, 'image/jpeg', 0.85);
        });

        // Avvio componenti
        initCamera();
        initGPS();
    </script>
</body>
</html>
