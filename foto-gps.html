<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamGeo Snap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Contenitore principale della fotocamera */
        .camera-container { position: relative; flex: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: #111; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Overlay in alto con GPS e Testo */
        .overlay-info {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(5px);
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 10;
            pointer-events: none; /* Lascia passare i tocchi se necessario */
        }
        .gps-row { font-size: 13px; font-family: monospace; color: #4ade80; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
        .text-row { font-size: 15px; font-weight: 500; color: #ffffff; word-break: break-word; }

        /* Pannello di controllo inferiore */
        .controls {
            padding: 20px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-top: 1px solid #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #4ade80; }
        
        button {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: #4ade80;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:active { background: #22c55e; }
        
        canvas { display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <!-- Overlay visivo in tempo reale -->
        <div class="overlay-info">
            <div class="gps-row" id="gpsDisplay">📍 Rilevamento GPS in corso...</div>
            <div class="text-row" id="textDisplay">Scrivi una nota qui sotto...</div>
        </div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <input type="text" id="userInput" placeholder="Inserisci una descrizione o nota..." maxlength="100">
        <button id="snapButton">📸 Scatta e Salva Foto</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const video = document.getElementById('video');
        const userInput = document.getElementById('userInput');
        const textDisplay = document.getElementById('textDisplay');
        const gpsDisplay = document.getElementById('gpsDisplay');
        const snapButton = document.getElementById('snapButton');
        const canvas = document.getElementById('canvas');

        let currentCoords = "GPS non disponibile";

        // 1. Avvia la fotocamera (preferendo la fotocamera posteriore sui telefoni)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                // Fallimento con "environment", riprova con una qualsiasi fotocamera disponibile
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                } catch (e) {
                    alert("Impossibile accedere alla fotocamera: " + e.message);
                }
            }
        }

        // 2. Ottieni la posizione GPS in tempo reale
        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const alt = position.coords.altitude ? `, Alt: ${position.coords.altitude.toFixed(1)}m` : '';
                        currentCoords = `Lat: ${lat}, Lon: ${lon}${alt}`;
                        gpsDisplay.textContent = `📍 ${currentCoords}`;
                    },
                    (error) => {
                        gpsDisplay.textContent = "📍 Errore GPS: " + error.message;
                        currentCoords = "GPS non disponibile";
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            } else {
                gpsDisplay.textContent = "📍 Geolocalizzazione non supportata";
            }
        }

        // Sincronizza il testo digitato con l'overlay in alto
        userInput.addEventListener('input', (e) => {
            const val = e.target.value.trim();
            textDisplay.textContent = val ? val : "Scrivi una nota qui sotto...";
        });

        // 3. Funzione per scattare la foto e imprimere i dati sul canvas
        snapButton.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("La fotocamera non è ancora pronta.");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            // Disegna il fotogramma della telecamera
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Crea un riquadro in alto per la grafica sovrapposta (stile badge)
            const padding = 30;
            const boxX = padding;
            const boxY = padding;
            const boxWidth = canvas.width - (padding * 2);
            const boxHeight = 160; // Altezza del riquadro informativo

            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
            ctx.lineWidth = 3;
            
            // Disegna rettangolo con angoli arrotondati (compatibile standard canvas)
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 20);
            ctx.fill();
            ctx.stroke();

            // Scrivi le coordinate GPS
            ctx.fillStyle = "#4ade80";
            ctx.font = "bold 28px monospace";
            ctx.fillText(`📍 ${currentCoords}`, boxX + 30, boxY + 55);

            // Scrivi il testo personalizzato (con supporto base a capo se troppo lungo)
            ctx.fillStyle = "#ffffff";
            ctx.font = "32px sans-serif";
            const userText = userInput.value.trim() || "Nessuna nota";
            ctx.fillText(userText, boxX + 30, boxY + 115, boxWidth - 60);

            // Salva l'immagine generata come file PNG scaricabile
            const imageURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.href = imageURL;
            link.download = `foto-geo-${Date.now()}.png`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Avvio componenti
        initCamera();
        initGPS();
    </script>
</body>
</html>
