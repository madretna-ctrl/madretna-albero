<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CamGeo Snap</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; height: 100dvh; background: #000; color: #fff; overflow: hidden; position: fixed; }
        
        body {
            display: flex;
            flex-direction: column;
        }

        /* Contenitore della fotocamera: occupa tutto lo spazio disponibile rimanente */
        .camera-container { 
            position: relative; 
            flex: 1; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #111; 
            overflow: hidden; 
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Overlay in alto */
        .overlay-info {
            position: absolute;
            top: 10px;
            left: 10px;
            max-width: calc(100% - 20px);
            background: rgba(0, 0, 0, 0.55);
            border-radius: 999px;
            padding: 4px 12px;
            z-index: 10;
            pointer-events: none;
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .gps-row { font-family: monospace; font-weight: bold; color: #4ade80; }
        .text-row { color: #ffffff; }
        .text-row:not(:empty)::before { content: " \00b7  "; color: #4ade80; }

        /* Pannello di controllo inferiore compatto */
        .controls {
            flex-shrink: 0;
            padding: 8px 12px 16px 12px;
            background: #1a1a1a;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px solid #333;
        }
        
        .controls-row {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        input[type="text"]:focus { border-color: #4ade80; }
        
        button {
            padding: 12px 16px;
            border-radius: 8px;
            border: none;
            background: #4ade80;
            color: #000;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        button:active { background: #22c55e; }
        button.sec { background: transparent; color: #ccc; border: 1px solid #555; }
        
        #permessiButton { background: #3b82f6; color: #fff; display: none; width: 100%; margin-bottom: 4px; }
        #permessiButton:active { background: #2563eb; }

        select {
            width: 100%; 
            padding: 8px 10px; 
            border-radius: 8px; 
            border: 1px solid #444;
            background: #2a2a2a; 
            color: #fff; 
            font-size: 13px;
        }

        .anteprima { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 30; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
        .anteprima img { max-width: 100%; max-height: 55vh; border-radius: 8px; }
        .anteprima p { color: #ccc; font-size: 13px; text-align: center; margin: 0; max-width: 420px; }
        .anteprima button { max-width: 420px; width: 100%; }
        canvas { display: none; }
        .toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: rgba(0,0,0,.8); color: #4ade80; font-size: 13px; padding: 8px 14px; border-radius: 999px; z-index: 20; max-width: 92%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: none; }
    </style>
</head>
<body>

    <div class="camera-container">
        <div class="overlay-info"><span class="gps-row" id="gpsDisplay">📍 GPS in corso…</span><span class="text-row" id="textDisplay"></span></div>
        <video id="video" autoplay playsinline></video>
    </div>

    <div class="controls">
        <button id="permessiButton">📷 Attiva fotocamera e consenti permessi</button>
        
        <!-- Riga unita: Campo di testo + Pulsante Scatta vicini -->
        <div class="controls-row">
            <input type="text" id="userInput" placeholder="Nome albero e classe, es. Daniela 5A" maxlength="100">
            <button id="snapButton">📸 Scatta</button>
        </div>

        <select id="modoSalva" aria-label="Dove salvare le foto">
            <option value="galleria">Salva in Foto / Galleria</option>
            <option value="download">Salva nella cartella Download</option>
        </select>
    </div>

    <canvas id="canvas"></canvas>
    <div class="toast" id="toast"></div>
    <div class="anteprima" id="anteprima">
        <img id="anteprimaImg" alt="Anteprima della foto">
        <p id="anteprimaNome"></p>
        <p>Nel menu che si apre scegli «Salva immagine» (iPhone) oppure Galleria / Foto (Android).</p>
        <button id="btnSalvaFoto">💾 Salva in Foto</button>
        <button id="btnScarta" class="sec">Scarta e rifai</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const userInput = document.getElementById('userInput');
        const textDisplay = document.getElementById('textDisplay');
        const gpsDisplay = document.getElementById('gpsDisplay');
        const snapButton = document.getElementById('snapButton');
        const permessiButton = document.getElementById('permessiButton');
        const canvas = document.getElementById('canvas');

        let currentCoords = "GPS non disponibile";
        let lastLat = null, lastLon = null;

        async function avviaFotocamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
                permessiButton.style.display = 'none';
            } catch (err) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = stream;
                    permessiButton.style.display = 'none';
                } catch (e) {
                    permessiButton.style.display = 'block';
                    toast("Permesso fotocamera negato o non disponibile.");
                }
            }
        }

        permessiButton.addEventListener('click', avviaFotocamera);

        function initGPS() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lon = position.coords.longitude.toFixed(6);
                        const alt = position.coords.altitude ? ` · ${Math.round(position.coords.altitude)} m` : '';
                        currentCoords = `${lat}, ${lon}${alt}`;
                        lastLat = position.coords.latitude; lastLon = position.coords.longitude;
                        gpsDisplay.textContent = `📍 ${currentCoords}`;
                    },
                    (error) => {
                        gpsDisplay.textContent = "📍 GPS non disponibile";
                        currentCoords = "GPS non disponibile";
                        lastLat = null; lastLon = null;
                    },
                    { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
                );
            } else {
                gpsDisplay.textContent = "📍 Geolocalizzazione non supportata";
            }
        }

        userInput.addEventListener('input', (e) => {
            textDisplay.textContent = e.target.value.trim();
        });

        function disegnaRiga(ctx, W, coords, nota) {
            let fs = Math.max(14, Math.round(W * 0.018));
            const gpsText = `📍 ${coords}`;
            const sep = ' \u00b7 ';
            const margin = Math.round(fs * 0.7);
            const padX = Math.round(fs * 0.7), padY = Math.round(fs * 0.4);
            const maxW = W - 2 * margin - 2 * padX;
            ctx.textBaseline = 'middle';

            const misura = () => {
                ctx.font = `bold ${fs}px monospace`;
                const g = ctx.measureText(gpsText).width;
                if (!nota) return { g, s: 0, n: 0 };
                ctx.font = `${fs}px sans-serif`;
                return { g, s: ctx.measureText(sep).width, n: ctx.measureText(nota).width };
            };
            let m = misura();
            while (m.g + m.s + m.n > maxW && fs > 11) { fs -= 1; m = misura(); }
            while (nota && m.g + m.s + m.n > maxW && nota.length > 1) {
                nota = nota.slice(0, -2).trimEnd() + '\u2026';
                m = misura();
            }

            const boxW = m.g + m.s + m.n + 2 * padX, boxH = fs + 2 * padY;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.beginPath();
            if (ctx.roundRect) ctx.roundRect(margin, margin, boxW, boxH, boxH / 2); else ctx.rect(margin, margin, boxW, boxH);
            ctx.fill();

            const y = margin + boxH / 2;
            let x = margin + padX;
            ctx.fillStyle = '#4ade80';
            ctx.font = `bold ${fs}px monospace`;
            ctx.fillText(gpsText, x, y);
            if (nota) {
                x += m.g;
                ctx.font = `${fs}px sans-serif`;
                ctx.fillText(sep, x, y);
                ctx.fillStyle = '#ffffff';
                ctx.fillText(nota, x + m.s, y);
            }
        }

        function aDms(d) {
            d = Math.abs(d);
            const g = Math.floor(d), m = Math.floor((d - g) * 60);
            const sec = Math.round(((d - g) * 60 - m) * 60 * 10000);
            return [[g, 1], [m, 1], [sec, 10000]];
        }
        function aggiungiExif(dataUrl, nota, lat, lon) {
            if (typeof piexif === 'undefined') return dataUrl;
            try {
                const ascii = (nota || 'foto').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '') || 'foto';
                const d = new Date(), z = n => String(n).padStart(2, '0');
                const quando = `${d.getFullYear()}:${z(d.getMonth() + 1)}:${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
                const zeroth = {}, exif = {}, gps = {};
                zeroth[piexif.ImageIFD.ImageDescription] = ascii;
                zeroth[piexif.ImageIFD.Software] = 'MadrEtna foto-gps';
                exif[piexif.ExifIFD.DateTimeOriginal] = quando;
                if (lat !== null && lon !== null) {
                    gps[piexif.GPSIFD.GPSLatitudeRef] = lat >= 0 ? 'N' : 'S';
                    gps[piexif.GPSIFD.GPSLatitude] = aDms(lat);
                    gps[piexif.GPSIFD.GPSLongitudeRef] = lon >= 0 ? 'E' : 'W';
                    gps[piexif.GPSIFD.GPSLongitude] = aDms(lon);
                }
                return piexif.insert(piexif.dump({ '0th': zeroth, 'Exif': exif, 'GPS': gps }), dataUrl);
            } catch (e) { return dataUrl; }
        }
        function dataUrlAFile(dataUrl, nome) {
            const bin = atob(dataUrl.split(',')[1]);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new File([bytes], nome, { type: 'image/jpeg' });
        }

        const modoSalva = document.getElementById('modoSalva');
        const puoCondividere = !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'x.jpg', { type: 'image/jpeg' })] }));
        if (!puoCondividere) {
            modoSalva.value = 'download';
            modoSalva.querySelector('option[value="galleria"]').disabled = true;
        } else {
            try { modoSalva.value = localStorage.getItem('modoSalva') || 'galleria'; } catch (e) { modoSalva.value = 'galleria'; }
        }
        modoSalva.addEventListener('change', () => { try { localStorage.setItem('modoSalva', modoSalva.value); } catch (e) {} });

        function toast(testo) {
            const t = document.getElementById('toast');
            t.textContent = testo; t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }
        function scarica(file) {
            const url = URL.createObjectURL(file);
            const link = document.createElement('a');
            link.href = url; link.download = file.name;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 5000);
        }

        let fotoInAttesa = null;
        const anteprima = document.getElementById('anteprima');
        function chiudiAnteprima() {
            anteprima.style.display = 'none';
            const img = document.getElementById('anteprimaImg');
            if (img.src) URL.revokeObjectURL(img.src);
            img.removeAttribute('src');
            fotoInAttesa = null;
        }
        document.getElementById('btnScarta').addEventListener('click', chiudiAnteprima);
        document.getElementById('btnSalvaFoto').addEventListener('click', async () => {
            if (!fotoInAttesa) return;
            const file = fotoInAttesa;
            try {
                await navigator.share({ files: [file] });
                toast('✔ Foto inviata a: ' + file.name);
                chiudiAnteprima();
            } catch (e) {
                if (e && e.name === 'AbortError') return;
                scarica(file);
                toast('Condivisione non riuscita: salvata in Download');
                chiudiAnteprima();
            }
        });

        snapButton.addEventListener('click', () => {
            if (!video.videoWidth) {
                alert("La fotocamera non è attiva. Clicca prima su 'Attiva fotocamera'.");
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const nota = userInput.value.trim();
            disegnaRiga(ctx, canvas.width, currentCoords, nota);

            const slug = nota.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'foto';
            const pos = (lastLat !== null && lastLon !== null)
                ? `_${lastLat.toFixed(6)}_${lastLon.toFixed(6)}` : '_senza-gps';
            const nomeFile = `${slug}${pos}.jpg`;
            const dataUrl = aggiungiExif(canvas.toDataURL('image/jpeg', 0.85), nota, lastLat, lastLon);
            const file = dataUrlAFile(dataUrl, nomeFile);

            if (modoSalva.value === 'galleria') {
                fotoInTechInAttesa = file;
                document.getElementById('anteprimaImg').src = URL.createObjectURL(file);
                document.getElementById('anteprimaNome').textContent = nomeFile;
                anteprima.style.display = 'flex';
            } else {
                scarica(file);
                toast('✔ Salvata in Download: ' + nomeFile);
            }
        });

        avviaFotocamera().catch(() => {
            permessiButton.style.display = 'block';
        });
        initGPS();
    </script>
</body>
</html>
