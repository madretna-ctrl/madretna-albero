<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Area Scuole — Giornata dell’Albero MadrEtna (demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{--verde:#2d5a27;--vc:#4a8c3f;--btn:#2d5a27;--lava:#1a1a1a;--sab:#f4ede0;--gr:#e8e2d9;--ros:#c0392b;--oro:#c98a2c;--sf:#fff;--mute:#666;--soft:#eaf5e6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--verde:#8bc34a;--sab:#1b1f1a;--sf:#262b25;--lava:#ece8dd;--gr:#3a4036;--mute:#a9b0a2;--soft:#2c3a2a}}
:root[data-theme="dark"]{--verde:#8bc34a;--sab:#1b1f1a;--sf:#262b25;--lava:#ece8dd;--gr:#3a4036;--mute:#a9b0a2;--soft:#2c3a2a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif;color:var(--lava);background:var(--sab);min-height:100vh}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.demo{background:#fff6e0;color:#7a5c12;text-align:center;font-size:.8rem;padding:6px 12px;border-bottom:1px solid #ecd9a0}
header{background:var(--sf);border-bottom:3px solid var(--verde);box-shadow:0 2px 12px rgba(0,0,0,.15);padding:0 1.2rem}
.hi{display:flex;align-items:center;gap:.7rem;height:64px;max-width:1000px;margin:0 auto}
header img{height:44px}
.zona{display:flex;align-items:center;gap:.35rem;font-family:'Playfair Display',serif;font-weight:700;padding-left:.7rem;border-left:1px solid var(--gr)}
.cuore{color:var(--ros)}
.hi .r{margin-left:auto;display:flex;gap:.5rem}
.hero{background:linear-gradient(rgba(26,26,26,.45),rgba(26,26,26,.45)),#2d5a27;color:#fff;text-align:center;padding:2.2rem 1.2rem 2rem}
.hero h1{font-size:2.1rem;line-height:1.25}
.hero p{max-width:520px;margin:.8rem auto 0;font-size:.95rem;opacity:.92;line-height:1.6}
.hero .t{height:210px;width:auto;display:block;margin:0 auto .6rem;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.sb{background:var(--verde)}
:root[data-theme="dark"] .sb,:root:not([data-theme="light"]) .sb{--x:0}
.sbi{max-width:1000px;margin:0 auto;display:flex;justify-content:center;gap:3rem;padding:.9rem 1.2rem;flex-wrap:wrap}
.si{text-align:center;color:var(--sab);font-size:.78rem}
.si b{display:block;font:700 1.5rem 'Playfair Display',serif;color:#fff}
main{max-width:1000px;margin:0 auto;padding:2rem 1.2rem 3rem}
.btn{background:var(--btn);color:#fff;border:0;border-radius:10px;padding:.7rem 1.3rem;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{background:var(--vc)}
.btn.alt{background:transparent;color:var(--verde);border:1.5px solid var(--gr)}
.btn.sm{padding:.35rem .7rem;font-size:.8rem}
input,select,textarea{background:var(--sf);border:1px solid var(--gr);border-radius:8px;padding:.65rem .8rem;width:100%;font-size:.92rem}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--vc);box-shadow:0 0 0 3px rgba(74,140,63,.2)}
label{display:block;font-size:.78rem;font-weight:600;color:var(--verde);margin:.9rem 0 .3rem}
.card{background:var(--sf);border-radius:16px;padding:1.5rem 1.4rem;box-shadow:0 4px 20px rgba(0,0,0,.06);border-top:4px solid var(--verde)}
.card.o{border-top-color:var(--oro)}.card.r{border-top-color:var(--ros)}
.card h3{font-size:1.1rem}.card p{margin:.3rem 0;font-size:.85rem;color:var(--mute);line-height:1.5}
.lc{max-width:420px;margin:-1px auto 0;padding:0}
.err{background:#fbe9e7;color:var(--ros);border:1px solid #f3c6c0;border-radius:8px;padding:.6rem .8rem;font-size:.82rem;margin-top:1rem}
.quick{margin-top:1.2rem;font-size:.8rem;color:var(--mute);display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:.3rem;border-bottom:2px solid var(--gr);margin-bottom:1.4rem;overflow-x:auto}
.tabs button{background:none;border:0;padding:.7rem 1rem;font-weight:600;color:var(--mute);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--verde);border-bottom-color:var(--verde)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:760px){.cols{grid-template-columns:1fr}.hero .t{height:160px}}
.alb{display:flex;gap:1rem;align-items:center;margin-bottom:1rem}
.alb img{height:96px;flex:none}
.pill{display:inline-block;background:var(--soft);color:var(--verde);border-radius:99px;padding:.1rem .65rem;font-size:.75rem;font-weight:600}
.pill.off{background:#fff6e0;color:#7a5c12}
.map{position:relative;aspect-ratio:2/1;border-radius:12px;overflow:hidden;background:linear-gradient(#cfe3f1,#f4ede0 70%)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map .m{position:absolute;transform:translate(-50%,-100%);text-align:center;font-size:.7rem;font-weight:600;line-height:1.1}
.map .m img{height:46px;display:block;margin:0 auto}
.map .m span{background:rgba(255,255,255,.85);color:#1a1a1a;border-radius:6px;padding:0 .3rem}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--sf);border-radius:16px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.06)}
th,td{text-align:left;padding:.7rem .8rem;border-bottom:1px solid var(--gr);font-size:.88rem}
th{background:var(--soft);color:var(--verde);font-size:.75rem}
code{background:var(--sab);padding:.1rem .4rem;border-radius:5px}
.tl{border-left:3px solid var(--verde);padding-left:1.2rem;margin-left:.4rem}
.tl article{margin-bottom:1.3rem;position:relative}
.tl article:before{content:"";position:absolute;left:-1.7rem;top:.3rem;width:12px;height:12px;border-radius:50%;background:var(--oro);border:2px solid var(--verde)}
.tl time{font-size:.75rem;color:var(--mute);font-weight:600}
.ph{width:100%;max-width:240px;aspect-ratio:4/3;border-radius:10px;object-fit:cover;background:var(--soft);display:block;margin-top:.4rem}
.cert{background:#fffdf4;color:#1a1a1a;border:3px double #2d5a27;outline:8px solid #f4ede0;padding:2rem 1.4rem;text-align:center;max-width:560px;margin:0 auto;border-radius:6px}
.cert img.l{height:40px}.cert img.t{height:170px;margin:.6rem 0}
.cert h2{font-size:1.9rem;color:#2d5a27}.cert .n{font:900 2rem 'Playfair Display',serif;margin:.3rem 0}
.cert p{margin:.4rem 0;font-size:.9rem}.cert .d{font:1.3rem 'Kaushan Script',cursive;color:#2d5a27}
.cert .sig{display:flex;justify-content:space-around;margin-top:1.6rem;font-size:.8rem}
.cert .sig div{border-top:1px solid #1a1a1a;padding-top:4px;min-width:130px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:.6rem 1.1rem;border-radius:10px;z-index:9;font-size:.85rem}
footer{text-align:center;padding:1.5rem;font-size:.75rem;color:var(--mute)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%;outline:0}}
</style>
</head>

<div class="demo">Versione dimostrativa: dati e password di fantasia, nessun dato reale viene salvato</div>
