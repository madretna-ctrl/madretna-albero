<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheda Albero — Giornata dell'Albero MadrEtna</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --verde:#2d5a27; --verde-chiaro:#4a8c3f; --lava:#1a1a1a; --sabbia:#f4ede0; --grigio:#e8e2d9; --rosso:#c0392b; }
  *{box-sizing:border-box}
  body{margin:0;font-family:'DM Sans',sans-serif;color:var(--lava);background:var(--sabbia);min-height:100vh}
  h1,h2,h3{font-family:'Playfair Display',serif;font-weight:700;margin:0}

  header{background:#fff;border-bottom:3px solid var(--verde);box-shadow:0 2px 12px rgba(0,0,0,.15);padding:0 1.2rem}
  .header-inner{display:flex;align-items:center;gap:.7rem;height:64px;max-width:760px;margin:0 auto}
  header img{height:44px}
  header a.indietro{margin-left:auto;color:var(--verde);text-decoration:none;font-size:.85rem;font-weight:600}

  main{max-width:760px;margin:0 auto;padding:1.6rem 1.2rem 3rem}

  .stato{text-align:center;color:#777;padding:3rem 1rem;font-size:.9rem}

  .scheda{display:none}
  .foto-grande{width:100%;max-height:340px;object-fit:cover;border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.12)}
  .foto-placeholder{width:100%;height:220px;border-radius:16px;background:var(--grigio);display:flex;align-items:center;justify-content:center;font-size:3rem}

  .titolo-riga{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-top:1.2rem;flex-wrap:wrap}
  .titolo-riga h1{font-size:1.8rem}
  .badge-adottato{background:var(--rosso);color:#fff;font-size:.75rem;font-weight:600;padding:.3rem .7rem;border-radius:20px;white-space:nowrap;align-self:flex-start;margin-top:.3rem}

  .griglia{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1.4rem}
  @media(max-width:560px){.griglia{grid-template-columns:1fr}}
  .campo{background:#fff;border-radius:12px;padding:.9rem 1.1rem;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .campo .etichetta{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--verde);font-weight:600}
  .campo .valore{font-size:1rem;margin-top:.2rem}

  .sezione{margin-top:2rem}
  .sezione h2{font-size:1.2rem;margin-bottom:.8rem}

  #mini-mappa{height:220px;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}

  .qr-box{background:#fff;border-radius:14px;padding:1.2rem;text-align:center;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .qr-box #qrcode{display:inline-block;margin-top:.5rem}
  .qr-box p{font-size:.78rem;color:#777;margin:.6rem 0 0}

  .diario-lista{display:flex;flex-direction:column;gap:.8rem}
  .diario-voce{background:#fff;border-radius:12px;padding:.9rem 1rem;box-shadow:0 2px 10px rgba(0,0,0,.05);display:flex;gap:.9rem}
  .diario-voce img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex-shrink:0}
  .diario-voce .testo{font-size:.85rem;color:#444;line-height:1.5}
  .diario-voce .data{font-size:.72rem;color:#999;margin-bottom:.2rem}
  .diario-vuoto{color:#888;font-size:.85rem;font-style:italic}

  .cta{display:inline-block;margin-top:.3rem;background:var(--verde);color:#fff;text-decoration:none;padding:.6rem 1.1rem;border-radius:10px;font-size:.85rem;font-weight:600}
</style>
</head>

<main>
  <div class="stato" id="stato">Caricamento scheda…</div>

  <div class="scheda" id="scheda">
    <img class="foto-grande" id="foto" style="display:none">
    <div class="foto-placeholder" id="foto-placeholder">🌳</div>

    <div class="titolo-riga">
      <h1 id="nome"></h1>
      <span class="badge-adottato" id="badge-adottato" style="display:none">🌳 Adottato</span>
    </div>

    <div class="griglia">
      <div class="campo"><div class="etichetta">Specie</div><div class="valore" id="specie"></div></div>
      <div class="campo"><div class="etichetta">Zona</div><div class="valore" id="zona"></div></div>
      <div class="campo"><div class="etichetta">Piantato da</div><div class="valore" id="piantatore"></div></div>
      <div class="campo"><div class="etichetta">Data di piantumazione</div><div class="valore" id="data"></div></div>
    </div>

    <div class="griglia" style="margin-top:1rem">
      <div class="sezione" style="margin-top:0">
        <h2>📍 Posizione</h2>
        <div id="mini-mappa"></div>
      </div>
      <div class="sezione" style="margin-top:0">
        <h2>📱 Codice albero</h2>
        <div class="qr-box">
          <div id="codice" style="font-weight:600"></div>
          <div id="qrcode"></div>
          <p>Inquadra per tornare a questa scheda</p>
        </div>
      </div>
    </div>

    <div class="sezione">
      <h2>📔 Diario di crescita</h2>
      <div class="diario-lista" id="diario-lista">
        <div class="diario-vuoto">Nessun aggiornamento ancora pubblicato.</div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const SUPABASE_URL = 'https://kmxevzxzezqqlgontiuy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_FGXvu3jHu4Zi5LzPzTR7pA_pORU1nLR';

async function supaGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
  });
  if (!res.ok) throw new Error(`Errore Supabase (${res.status})`);
  const testo = await res.text();
  return testo ? JSON.parse(testo) : [];
}

function formattaData(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
}

(async () => {
  const params = new URLSearchParams(location.search);
  const codice = params.get('c');
  const stato = document.getElementById('stato');

  if (!codice) {
    stato.textContent = 'Nessun codice albero indicato nel link.';
    return;
  }

  try {
    const risultati = await supaGet(`v_alberi_pubblici?select=*&codice=eq.${encodeURIComponent(codice)}`);
    const a = risultati[0];
    if (!a) {
      stato.textContent = `Nessun albero trovato con codice ${codice}.`;
      return;
    }

    stato.style.display = 'none';
    document.getElementById('scheda').style.display = 'block';

    document.getElementById('nome').textContent = a.nome || 'Albero senza nome';
    document.getElementById('specie').textContent = a.specie || '—';
    document.getElementById('zona').textContent = a.zona || '—';
    document.getElementById('piantatore').textContent = a.piantatore_tipo === 'classe'
      ? `${a.scuola || 'una scuola'} — ${a.piantatore_nome || ''}`
      : (a.piantatore_nome || '—');
    document.getElementById('data').textContent = formattaData(a.data_piantumazione);
    document.getElementById('codice').textContent = a.codice;

    if (a.adottato) document.getElementById('badge-adottato').style.display = 'inline-block';

    if (a.foto_url) {
      const img = document.getElementById('foto');
      img.src = a.foto_url;
      img.style.display = 'block';
      document.getElementById('foto-placeholder').style.display = 'none';
    }

    if (a.lat != null && a.lng != null) {
      const mappa = L.map('mini-mappa', { zoomControl: false, dragging: false, scrollWheelZoom: false })
        .setView([a.lat, a.lng], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap contributors'
      }).addTo(mappa);
      L.marker([a.lat, a.lng]).addTo(mappa);
    }

    new QRCode(document.getElementById('qrcode'), {
      text: location.href,
      width: 120, height: 120,
      colorDark: '#2d5a27', colorLight: '#ffffff'
    });

    // Diario di crescita (solo voci approvate)
    try {
      const diario = await supaGet(`diario?select=*&albero_id=eq.${a.id}&approvato=eq.true&order=data_rilevo.desc`);
      if (diario.length > 0) {
        const lista = document.getElementById('diario-lista');
        lista.innerHTML = '';
        diario.forEach(v => {
          const foto = v.foto_url ? `<img src="${v.foto_url}" alt="">` : '';
          const el = document.createElement('div');
          el.className = 'diario-voce';
          el.innerHTML = `${foto}<div class="testo"><div class="data">${formattaData(v.data_rilevo)}${v.altezza_cm ? ' · ' + v.altezza_cm + ' cm' : ''}</div>${v.testo || ''}</div>`;
          lista.appendChild(el);
        });
      }
    } catch (e) { console.error('Diario non disponibile', e); }

  } catch (e) {
    stato.textContent = 'Impossibile caricare la scheda. Riprova più tardi.';
    console.error(e);
  }
})();
</script>
