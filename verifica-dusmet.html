function pip(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if((P[i][1]>y)!=(P[j][1]>y)&&x<(P[j][0]-P[i][0])*(y-P[i][1])/(P[j][1]-P[i][1])+P[i][0])c=!c}return c}
function sd(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((x-a[0])*dx+(y-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy)}
function zd(r){if(!Z.length||r.lat==null||r.lon==null||isNaN(r.lat)||isNaN(r.lon))return null;
 const [x,y]=M(r.lat,r.lon);let best=1e9,nm='';
 for(const z of Z){const P=z.p.map(q=>M(q[0],q[1]));let d=pip(x,y,P)?0:1e9;
  if(d)for(let i=0;i<P.length;i++)d=Math.min(d,sd(x,y,P[i],P[(i+1)%P.length]));
  if(d<best){best=d;nm=z.n}}
 return{d:best,n:nm}}
const out=r=>{if(r.lat==null||isNaN(r.lat))return false;if(!inArea(r.lat,r.lon))return true;const z=zd(r);return !!z&&z.d>(+tol.value||30)};
const okf=r=>!out(r)&&(r.ok??r.s==='ok');
function pts(v){if(typeof v==='string'){try{v=JSON.parse(v)}catch{return null}}
 if(v&&v.geometry)v=v.geometry;if(v&&v.coordinates)v=v.coordinates;if(!Array.isArray(v))return null;
 if(Array.isArray(v[0])&&Array.isArray(v[0][0]))v=v[0];
 const p=v.map(q=>Array.isArray(q)?q:q&&[q.lat??q.latitude,q.lng??q.lon??q.longitude]).filter(q=>q&&isFinite(q[0])&&isFinite(q[1])&&q[0]!==null);
 if(p.length<3)return null;return p.map(q=>+q[0]>30?[+q[0],+q[1]]:[+q[1],+q[0]])}
async function zone(){
 const u=url.value.trim().replace(/\/$/,''),k=key.value.trim();
 try{const res=await fetch(u+'/rest/v1/zone_candidate?select=*',{headers:{apikey:k,Authorization:'Bearer '+k}});
  const rows=await res.json();if(!Array.isArray(rows))throw new Error(JSON.stringify(rows));
  Z=[];for(const r of rows){let p=pts(r.perimetro);if(!p)for(const c in r){p=pts(r[c]);if(p)break}
   if(p)Z.push({n:r.nome||r.name||r.titolo||('zona '+r.id),p})}
  zinfo.innerHTML=Z.length?'Zone caricate: <b>'+Z.map(z=>z.n+' ('+z.p.length+' vertici)').join(', ')+'</b>':'<span class="bad">Nessun poligono riconosciuto. Colonne: '+Object.keys(rows[0]||{}).join(', ')+'</span>';
  render()}catch(e){zinfo.innerHTML='<span class="bad">Errore zone: '+e.message+'</span>'}}
const kf=r=>r.c+'/'+r.f;
files.onchange=e=>{for(const f of e.target.files){const p=(f.webkitRelativePath||f.name).split('/');F[p.slice(-2).join('/')]=f}render()};cls.onchange=render;
flt.onchange=render;
function render(){
 g.innerHTML='';let n=0;
 D.forEach((r,i)=>{
  const o=out(r),ok=okf(r),z=zd(r);
  if(cls.value&&r.c!==cls.value)return;if(flt.value==='todo'&&(ok||o))return;if(flt.value==='ok'&&!ok)return;if(flt.value==='fuori'&&!o)return;
  n++;const c=document.createElement('div');c.className='card '+(o?'fuori':ok?'ok':r.s);
  c.innerHTML=`<canvas height="1"></canvas><b>Classe ${r.c}</b> <small>· coord. da ${r.src||'—'}</small><br><small>${r.f}</small>
  <div class="row"><input value="${r.n}" placeholder="nome alberello" data-k="n"></div><div class="row"><input value="${r.lat??''}" placeholder="lat" data-k="lat"><input value="${r.lon??''}" placeholder="lon" data-k="lon"></div>
  ${o?`<div class="bad">Fuori zona${z?' · '+Math.round(z.d)+' m dalla zona '+z.n:' · fuori dai Monti Rossi'}: da rifotografare</div>`:z?`<small>Dentro/vicino: ${z.n} (${Math.round(z.d)} m)</small><br>`:''}<label><input type="checkbox" ${ok?'checked':''} ${o?'disabled':''}> confermata</label>`;
  const cv=c.querySelector('canvas'),file=F[kf(r)];
  if(file){const im=new Image();im.onload=()=>{cv.width=im.width;cv.height=48;cv.getContext('2d').drawImage(im,0,0);
   const t=document.createElement('img');t.src=im.src;c.appendChild(t)};im.src=URL.createObjectURL(file)}
  c.querySelectorAll('input[data-k]').forEach(x=>x.onchange=()=>{if(x.dataset.k==='n'){r.n=x.value;return}r[x.dataset.k]=parseFloat(x.value.replace(',','.'));if(Z.length)render()});
  c.querySelector('[type=checkbox]').onchange=e=>{r.ok=e.target.checked;c.className='card '+(r.ok?'ok':r.s);cnt.textContent=D.filter(okf).length+'/'+D.length+' confermate'};
  g.appendChild(c)});
 cnt.textContent=n+' mostrate · '+D.filter(okf).length+'/'+D.length+' confermate';
}
function csv(){
 const L=['classe,file,nome,lat,lon,confermata',...D.map(r=>[r.c,r.f,r.n,r.lat??'',r.lon??'',okf(r)?1:0].map(v=>`"${v}"`).join(','))];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\n')],{type:'text/csv'}));a.download='foto_piantumazione.csv';a.click()}
function comp(file,max,q){return new Promise(res=>{const im=new Image();im.onload=()=>{
 const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
 c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(res,'image/jpeg',q)};im.src=URL.createObjectURL(file)})}
async function up(){
 const sb=supabase.createClient(url.value.trim(),key.value.trim());
 const {error:e0}=await sb.auth.signInWithPassword({email:em.value,password:pw.value});
 if(e0){log.textContent='Login: '+e0.message;return}
 let n=0,kb=0;log.textContent='';
 for(const r of D){
  if(!okf(r)||!F[kf(r)]||!inArea(r.lat,r.lon))continue;if(!Z.length){log.textContent='Zone non caricate: premi il pulsante 1.';return}
  const id=(r.c+'_'+r.f).replace(/\.[^.]+$/,'').normalize('NFD').replace(/[^\w]+/g,'_').toLowerCase();
  const a=await comp(F[kf(r)],800,.6),t=await comp(F[kf(r)],200,.6);
  const o={contentType:'image/jpeg',upsert:true};
  const p1=await sb.storage.from('foto-piantumazione').upload(`foto/${id}.jpg`,a,o);
  const p2=await sb.storage.from('foto-piantumazione').upload(`thumb/${id}.jpg`,t,o);
  const d=await sb.from('foto_piantumazione').upsert({file_originale:'Dusmet/'+r.c+'/'+r.f,classe:r.c,nome:r.n,lat:r.lat,lon:r.lon,verificata:true,path:`foto/${id}.jpg`,thumb_path:`thumb/${id}.jpg`},{onConflict:'file_originale'});
  const er=p1.error||p2.error||d.error;
  if(er)log.textContent+=r.f+': '+er.message+'\n';else{n++;kb+=(a.size+t.size)/1024}
  log.textContent=`Caricate ${n} · ${Math.round(kb)} KB totali\n`+log.textContent.split('\n').slice(1).join('\n')}
 log.textContent+='Fatto.'}
render();zone();
</script></body></html>
